<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <!-- Background -->
  <rect width="280" height="180" fill="#c0c0c0"/>
  
  <!-- Window -->
  <rect x="10" y="10" width="260" height="160" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="12" y="12" width="256" height="16" fill="#000080"/>
  <text x="18" y="24" font-family="Arial" font-size="9" fill="white" font-weight="bold">📝 Step 1: Define Your Style</text>
  
  <!-- Content -->
  <rect x="15" y="32" width="250" height="132" fill="#ffffff" stroke="#808080"/>
  
  <!-- Tabs -->
  <rect x="20" y="38" width="60" height="18" fill="#c0c0c0" stroke="#808080"/>
  <text x="28" y="51" font-family="Arial" font-size="8" fill="#000">Article 1 ✓</text>
  <rect x="82" y="38" width="60" height="18" fill="#ffffff" stroke="#808080"/>
  <text x="90" y="51" font-family="Arial" font-size="8" fill="#808080">Article 2</text>
  <rect x="144" y="38" width="60" height="18" fill="#ffffff" stroke="#808080"/>
  <text x="152" y="51" font-family="Arial" font-size="8" fill="#808080">Article 3</text>
  
  <!-- Text area -->
  <rect x="20" y="60" width="240" height="80" fill="#ffffff" stroke="#000080" stroke-width="2"/>
  <text x="25" y="75" font-family="Arial" font-size="8" fill="#333">Your writing sample goes here...</text>
  <rect x="25" y="82" width="180" height="6" fill="#e8e8e8"/>
  <rect x="25" y="92" width="200" height="6" fill="#e8e8e8"/>
  <rect x="25" y="102" width="160" height="6" fill="#e8e8e8"/>
  <rect x="25" y="112" width="190" height="6" fill="#e8e8e8"/>
  <rect x="25" y="122" width="140" height="6" fill="#e8e8e8"/>
  
  <!-- Word count -->
  <text x="20" y="152" font-family="Arial" font-size="8" fill="#008000">✓ 245 words</text>
  
  <!-- Button -->
  <rect x="180" y="145" width="75" height="18" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  <text x="192" y="157" font-family="Arial" font-size="9" fill="#000">Continue →</text>
</svg>