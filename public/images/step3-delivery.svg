<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <!-- Background -->
  <rect width="280" height="180" fill="#c0c0c0"/>
  
  <!-- Window -->
  <rect x="10" y="10" width="260" height="160" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="12" y="12" width="256" height="16" fill="#000080"/>
  <text x="18" y="24" font-family="Arial" font-size="9" fill="white" font-weight="bold">📬 Step 3: Get Articles</text>
  
  <!-- Content -->
  <rect x="15" y="32" width="250" height="132" fill="#ffffff" stroke="#808080"/>
  
  <!-- Email preview -->
  <rect x="20" y="40" width="240" height="90" fill="#f8f8f8" stroke="#c0c0c0"/>
  
  <!-- Email header -->
  <rect x="22" y="42" width="236" height="20" fill="#000080"/>
  <text x="28" y="56" font-family="Arial" font-size="9" fill="white">📧 New Article: "The Future of AI"</text>
  
  <!-- Email content preview -->
  <text x="28" y="75" font-family="Arial" font-size="8" fill="#333" font-weight="bold">Your personalized article is ready!</text>
  <rect x="28" y="82" width="200" height="5" fill="#e0e0e0"/>
  <rect x="28" y="90" width="180" height="5" fill="#e0e0e0"/>
  <rect x="28" y="98" width="190" height="5" fill="#e0e0e0"/>
  <rect x="28" y="106" width="160" height="5" fill="#e0e0e0"/>
  
  <!-- Read button in email -->
  <rect x="28" y="115" width="60" height="12" fill="#008000" rx="2"/>
  <text x="36" y="124" font-family="Arial" font-size="7" fill="white">Read Article</text>
  
  <!-- Status -->
  <rect x="20" y="135" width="100" height="16" fill="#008000" rx="2"/>
  <text x="28" y="146" font-family="Arial" font-size="8" fill="white">✓ Delivered Daily</text>
  
  <!-- Sparkles -->
  <text x="230" y="50" font-size="14">✨</text>
  <text x="200" y="145" font-size="12">📬</text>
</svg>