<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <!-- Background -->
  <rect width="400" height="250" fill="#c0c0c0"/>
  
  <!-- Window frame -->
  <rect x="20" y="15" width="360" height="220" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  <rect x="22" y="17" width="356" height="216" fill="white" stroke="#dfdfdf" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="24" y="19" width="352" height="18" fill="#000080"/>
  <text x="30" y="32" font-family="Arial" font-size="11" fill="white" font-weight="bold">📝 Article Generator - Drafter</text>
  
  <!-- Window buttons -->
  <rect x="340" y="22" width="12" height="12" fill="#c0c0c0" stroke="#808080"/>
  <rect x="354" y="22" width="12" height="12" fill="#c0c0c0" stroke="#808080"/>
  
  <!-- Content area -->
  <rect x="30" y="45" width="340" height="180" fill="#ffffff" stroke="#808080"/>
  
  <!-- Article preview lines -->
  <rect x="40" y="55" width="200" height="12" fill="#000080" rx="2"/>
  <rect x="40" y="75" width="310" height="8" fill="#e0e0e0" rx="1"/>
  <rect x="40" y="88" width="290" height="8" fill="#e0e0e0" rx="1"/>
  <rect x="40" y="101" width="300" height="8" fill="#e0e0e0" rx="1"/>
  <rect x="40" y="114" width="250" height="8" fill="#e0e0e0" rx="1"/>
  
  <!-- AI indicator -->
  <rect x="40" y="135" width="80" height="20" fill="#008080" rx="3"/>
  <text x="50" y="149" font-family="Arial" font-size="10" fill="white">✨ AI Writing</text>
  
  <!-- Progress bar -->
  <rect x="40" y="165" width="310" height="15" fill="#ffffff" stroke="#808080"/>
  <rect x="42" y="167" width="200" height="11" fill="#000080"/>
  
  <!-- Status text -->
  <text x="40" y="200" font-family="Arial" font-size="10" fill="#808080">Generating article in your style...</text>
  
  <!-- Sparkle effects -->
  <text x="280" y="55" font-size="16">✨</text>
  <text x="320" y="140" font-size="14">⚡</text>
</svg>