<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="synthwave-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sun-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b00ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a1a" stroke="url(#synthwave-gradient)" stroke-width="2"/>
  
  <!-- Synthwave sun -->
  <circle cx="50" cy="45" r="25" fill="url(#sun-gradient)"/>
  
  <!-- Sun horizontal lines (synthwave style) -->
  <rect x="25" y="40" width="50" height="2" fill="#0a0a1a"/>
  <rect x="25" y="45" width="50" height="2" fill="#0a0a1a"/>
  <rect x="25" y="50" width="50" height="3" fill="#0a0a1a"/>
  <rect x="25" y="56" width="50" height="4" fill="#0a0a1a"/>
  <rect x="25" y="63" width="50" height="5" fill="#0a0a1a"/>
  
  <!-- Grid lines (perspective) -->
  <g stroke="#00ffff" stroke-width="0.5" opacity="0.7">
    <!-- Horizontal grid lines -->
    <line x1="10" y1="75" x2="90" y2="75"/>
    <line x1="15" y1="80" x2="85" y2="80"/>
    <line x1="20" y1="85" x2="80" y2="85"/>
    <line x1="25" y1="90" x2="75" y2="90"/>
    
    <!-- Vertical perspective lines -->
    <line x1="50" y1="70" x2="50" y2="95"/>
    <line x1="50" y1="70" x2="30" y2="95"/>
    <line x1="50" y1="70" x2="70" y2="95"/>
    <line x1="50" y1="70" x2="15" y2="95"/>
    <line x1="50" y1="70" x2="85" y2="95"/>
  </g>
  
  <!-- D letter stylized -->
  <text x="50" y="55" font-family="Arial Black, sans-serif" font-size="28" font-weight="bold" fill="#00ffff" text-anchor="middle" dominant-baseline="middle" style="filter: drop-shadow(0 0 3px #00ffff);">D</text>
</svg>